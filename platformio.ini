; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Upload targets:
;   pio run -e <env> -t upload     — flash firmware only; SPIFFS is untouched,
;                                    so existing device configuration is preserved.
;   pio run -e <env> -t uploadfs   — flash filesystem image with factory-default
;                                    tracker_conf.json; use only for first install
;                                    or to intentionally reset configuration.

[platformio]
default_envs = heltec_t114, heltec_v3_433_aprs, tbeam_433_aprs, tbeam_433_1w_aprs, lilygo_t3_433_aprs, lilygo_t3s3_433_aprs, LoRanger_V1, LoRanger_V2, heltec_wireless_tracker_433_aprs

extra_configs =
	common_settings.ini
  	variants/*/platformio.ini

[env]
framework = arduino
monitor_speed = 115200
; chain+ (rather than deep+) walks declared library dependencies while
; preprocessing #if/#ifdef branches. deep+ misses Arduino-ESP32 3.x framework
; libraries that are transitively required by third-party libs — e.g. AsyncTCP
; 3.6.1 includes <NetworkInterface.h> from the framework-bundled "Networking"
; library without naming it as a dependency in library.json, so deep+ scans it
; but doesn't push its include dir down to AsyncTCP's compile units.
lib_ldf_mode = chain+

[env:esp32]
extends = env
; Pioarduino — community-maintained fork of platform-espressif32 that tracks
; Espressif's current Arduino core releases. The upstream PlatformIO platform
; (platformio/espressif32) lags Espressif by months and is stuck on ESP-IDF
; 4.4, which pre-dates the new i2c_master driver we need on LoRanger V2.
; Pioarduino 55.03.311 ships ESP-IDF 5.5.x and Arduino core 3.3.x.
;
; Version pin rationale: 55.03.311 is the newest release whose PlatformIO
; Core compatibility check accepts PlatformIO 6.2.0.post1 (local toolchain
; version); 55.03.312+ has a broken check that rejects it. Revisit when
; pioarduino fixes the check upstream.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; 4MB boards (tbeam, lilygo_t3) use huge_app.csv — firmware is ~2 MB, leaving no room
; for two equal OTA slots on 4 MB flash. OTA is supported only on 8 MB boards (heltec_v3,
; LoRanger_V1, LoRanger_V2) via partitions_8mb_ota.csv override in their variant
; platformio.ini files.
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder
board_build.embed_files =
	data_embed/index.html.gz
	data_embed/style.css.gz
	data_embed/script.js.gz
	data_embed/bootstrap.css.gz
	data_embed/bootstrap.js.gz
	data_embed/favicon.png.gz
extra_scripts =
	pre:tools/gen_version.py
	pre:tools/compress.py
debug_tool = esp-prog