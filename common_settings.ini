; ============================================================================
; nRF52 platform defaults
; ----------------------------------------------------------------------------
; Standalone block (does NOT extend [common] which carries ESP32-specific
; lib_deps like NimBLE/AsyncTCP/ESPAsyncWebServer). nRF52 variants
; reference ${nrf52_common.build_flags} / ${nrf52_common.lib_deps}.
;
; The HAS_WIFI / HAS_NIMBLE / HAS_WEB_UI capability flags are deliberately
; *not* defined here — those subsystems don't exist on nRF52 and the
; capability gates added in PR-1 step 1 keep the corresponding code out.
;
; HAS_BT_CLASSIC / HAS_TOUCHSCREEN remain per-variant in board_pinout.h
; (they're hardware capabilities, not platform).
; ============================================================================
[nrf52_common]
extra_scripts =
	pre:tools/gen_version.py
	pre:tools/embed_config.py
	post:tools/build_uf2.py
build_unflags =
	-std=gnu++11
	-std=gnu++14
build_flags =
	-Werror -Wall
	; C++17 needed so the SPIFFS shim's `return File(path, mode, fs);` benefits
	; from mandatory prvalue copy elision. Adafruit_LittleFS::File auto-closes
	; in its destructor and has no real copy/move ctor — under C++14 a copy
	; would close the temporary's handle before the caller could use it.
	-std=gnu++17
	; gcc-arm-none-eabi flags signed/unsigned comparisons that gcc-xtensa lets pass.
	; The codebase has many millis()/uint32_t vs signed-int * 1000 expressions and
	; container index loops; cleaning these up is its own refactor. Punt for now.
	-Wno-sign-compare
	-D SERIAL_BUFFER_SIZE=16384
	-D RADIOLIB_EXCLUDE_CC1101=1
	-D RADIOLIB_EXCLUDE_RF69=1
	-D RADIOLIB_EXCLUDE_RFM2X=1
	-D RADIOLIB_EXCLUDE_SX1231=1
	-D RADIOLIB_EXCLUDE_SX1233=1
	-D RADIOLIB_EXCLUDE_SI443X=1
	-D RADIOLIB_EXCLUDE_NRF24=1
	-D RADIOLIB_EXCLUDE_AFSK=1
	-D RADIOLIB_EXCLUDE_APRS=1
	-D RADIOLIB_EXCLUDE_AX25=1
	-D RADIOLIB_EXCLUDE_BELL=1
	-D RADIOLIB_EXCLUDE_FSK4=1
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
	-D RADIOLIB_EXCLUDE_LORAWAN=1
	-D RADIOLIB_EXCLUDE_MORSE=1
	-D RADIOLIB_EXCLUDE_PAGER=1
	-D RADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
	-D RADIOLIB_EXCLUDE_RTTY=1
	-D RADIOLIB_EXCLUDE_SSTV=1
	-I variants/${PIOENV}
	-I include/nrf52_shims
lib_deps =
	adafruit/Adafruit BusIO @ 1.17.4
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit BME280 Library @ 2.3.0
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
	bblanchon/ArduinoJson @ 7.4.3
	jgromes/RadioLib @ 7.8.1
	mikalhart/TinyGPSPlus @ 1.1.0
	paulstoffregen/Time @ 1.6.1
	shaggydog/OneButton @ 1.5.0
display_libs =
	adafruit/Adafruit GFX Library @ 1.13.0
	adafruit/Adafruit ST7735 and ST7789 Library @ 1.12.0

[common]
build_flags =
	-Werror -Wall
	; RadioLib 7.8.x emits a #warning on boards that enable ARDUINO_USB_CDC_ON_BOOT
	; ("Use of USB CDC for debug output is not recommended — might stop on first
	; sleep"). It's advisory (we don't sleep through CDC traffic), but -Werror
	; promotes it to an error. Demote #warning directives to warnings while
	; keeping -Werror in effect for every other category.
	-Wno-error=cpp
	; TFT_eSPI 2.5.x ships a macro in Processors/TFT_eSPI_ESP32_S3.h whose
	; indentation misleads gcc 14 (which is stricter than earlier versions);
	; the generated code is correct. Demote this one category to a warning.
	-Wno-error=misleading-indentation
	; Arduino-ESP32 core 3.x factored WiFi's low-level APIs into a separate
	; framework-bundled "Network" library (NetworkInterface.h / NetworkClient.h
	; etc.). AsyncTCP 3.6.1 and other 3.x-aware libs include these headers
	; directly, but LDF doesn't push the framework library's include dir down
	; to third-party libs' compile units (AsyncTCP's library.json doesn't
	; declare Network as a dependency). Push the include dir explicitly here.
	-I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
	; Same LDF-propagation issue affects BluetoothSerial (framework-bundled,
	; only used on boards that opt in via HAS_BT_CLASSIC). The include is a
	; no-op on chips without BT Classic hardware (the header itself has an
	; internal guard), so pushing it unconditionally is safe for S3/C3 etc.
	-I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/BluetoothSerial/src"
	-D HAS_WIFI=1
	-D HAS_NIMBLE=1
	-D HAS_WEB_UI=1
	-D HAS_DISPLAY=1
	-D RADIOLIB_EXCLUDE_CC1101=1
	-D RADIOLIB_EXCLUDE_RF69=1
	-D RADIOLIB_EXCLUDE_RFM2X=1
	-D RADIOLIB_EXCLUDE_SX1231=1
	-D RADIOLIB_EXCLUDE_SX1233=1
	-D RADIOLIB_EXCLUDE_SI443X=1
	-D RADIOLIB_EXCLUDE_NRF24=1
	-D RADIOLIB_EXCLUDE_AFSK=1
	-D RADIOLIB_EXCLUDE_APRS=1
	-D RADIOLIB_EXCLUDE_AX25=1
	-D RADIOLIB_EXCLUDE_BELL=1
	-D RADIOLIB_EXCLUDE_FSK4=1
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
	-D RADIOLIB_EXCLUDE_LORAWAN=1
	-D RADIOLIB_EXCLUDE_MORSE=1
	-D RADIOLIB_EXCLUDE_PAGER=1
	-D RADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
	-D RADIOLIB_EXCLUDE_RTTY=1
	-D RADIOLIB_EXCLUDE_SSTV=1
	-I variants/${PIOENV}
lib_deps =
	adafruit/Adafruit BusIO @ 1.17.4
	adafruit/Adafruit Unified Sensor @ 1.1.15
	adafruit/Adafruit BME280 Library @ 2.3.0
	adafruit/Adafruit BMP280 Library @ 3.0.0
	adafruit/Adafruit BME680 Library @ 2.0.6
	bblanchon/ArduinoJson @ 7.4.3
	h2zero/NimBLE-Arduino @ 2.5.2
	jgromes/RadioLib @ 7.8.1
	ESP32Async/AsyncTCP @ 3.6.1
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	mikalhart/TinyGPSPlus @ 1.1.0
	paulstoffregen/Time @ 1.6.1
	shaggydog/OneButton @ 1.5.0
display_libs =
	adafruit/Adafruit GFX Library @ 1.13.0
	adafruit/Adafruit SSD1306 @ 2.5.17
usb_flags=
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1