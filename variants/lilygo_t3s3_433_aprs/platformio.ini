; LilyGo T3-S3 V1.2 / V1.3 (SX1262) — 433 MHz APRS multi-role (iGate / Digipeater / Tracker)
;
; Requires the SX1262 radio with a 433 MHz RF front end (see board_pinout.h).
; No onboard GPS: set GPS source to "Fixed" via web UI or serial CLI.
; WiFi STA + APRS-IS + TCP KISS available via iGate role.
; BLE KISS TNC available via NimBLE (APRS.fi UUID set).
; USB-serial KISS available at 115200 baud over native USB CDC.
;
; Build:  pio run -e lilygo_t3s3_433_aprs
; Upload: pio run -e lilygo_t3s3_433_aprs -t upload
; FS:     pio run -e lilygo_t3s3_433_aprs -t uploadfs

; Allow the PlatformIO VSCode extension to resolve ${common.*} when this file
; is parsed standalone (without the root platformio.ini as the entry point).
[platformio]
extra_configs = ../../common_settings.ini

[env:lilygo_t3s3_433_aprs]
extends = env:esp32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_upload.flash_size = 4MB
; ESP32-S3 firmware (~1.4 MB) fits the 1.875 MB slots, so OTA works on this 4 MB board.
board_build.partitions = partitions_4mb_ota.csv
; Native ESP32-S3 USB-Serial/JTAG (no USB-UART bridge): Serial output is gated
; on DTR, and the exception-decoder filter mangles the native USB stream
; (same settings as LoRanger_V1).
monitor_dtr = 1
monitor_rts = 0
monitor_filters =
build_flags =
    ${common.build_flags}
    ${common.usb_flags}
    -D RADIOLIB_EXCLUDE_LR11X0=1
    -D RADIOLIB_EXCLUDE_SX127X=1
    -D RADIOLIB_EXCLUDE_SX128X=1
    -D LILYGO_T3S3_433_APRS
lib_deps =
    ${common.lib_deps}
    ${common.display_libs}
