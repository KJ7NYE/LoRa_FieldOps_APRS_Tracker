; Heltec Wireless Tracker V1.1 — 433 MHz APRS multi-role (Tracker / iGate / Digipeater)
;
; ESP32-S3FN8 (8 MB flash, no PSRAM) with SX1262 LoRa, onboard UC6580 GNSS,
; 0.96" 160x80 ST7735 TFT (via TFT_eSPI), WiFi + NimBLE. No PMIC; battery via
; ADC divider gated by ADC_CTRL (see board_pinout.h).
; Default role: Tracker with GPS_INTERNAL and SmartBeaconing.
; Switch to iGate or Digipeater via web UI or serial CLI ("role set ...").
;
; Build:  pio run -e heltec_wireless_tracker_433_aprs
; Upload: pio run -e heltec_wireless_tracker_433_aprs -t upload
; FS:     pio run -e heltec_wireless_tracker_433_aprs -t uploadfs

; Allow the PlatformIO VSCode extension to resolve ${common.*} when this file
; is parsed standalone (without the root platformio.ini as the entry point).
[platformio]
extra_configs = ../../common_settings.ini

[env:heltec_wireless_tracker_433_aprs]
extends = env:esp32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.partitions = partitions_8mb_ota.csv
; Native ESP32-S3 USB-Serial/JTAG (ARDUINO_USB_MODE=1) gates TX flush on DTR high.
; No USB-UART bridge on this board so DTR/RTS aren't wired to bootloader straps —
; asserting DTR won't cause spurious resets.
monitor_dtr = 1
monitor_rts = 0
; Override env:esp32's monitor_filters = esp32_exception_decoder — that filter
; has known issues with native USB-Serial/JTAG streams and may eat live output.
monitor_filters =
build_flags =
    ${common.build_flags}
    ${common.usb_flags}
    -D RADIOLIB_EXCLUDE_LR11X0=1
    -D RADIOLIB_EXCLUDE_SX127X=1
    -D RADIOLIB_EXCLUDE_SX128X=1
    -D HELTEC_WIRELESS_TRACKER
    ; TFT_eSPI is configured entirely at compile time (no User_Setup.h) —
    ; ST7735 160x80, SPI pins per board_pinout.h header comment.
    -D USER_SETUP_LOADED
    -D TFT_WIDTH=80
    -D TFT_HEIGHT=160
    -D ST7735_DRIVER
    -D ST7735_GREENTAB160x80
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=42
    -D TFT_SCLK=41
    -D TFT_CS=38
    -D TFT_DC=40
    -D TFT_RST=39
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=1
    -D TOUCH_CS=-1
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D SPI_FREQUENCY=27000000
    -D USE_HSPI_PORT
lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI @ 2.5.43
