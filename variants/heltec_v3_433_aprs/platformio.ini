; Heltec WiFi LoRa 32 V3.2 — 433 MHz APRS multi-role (iGate / Digipeater / Tracker)
;
; V3.2 silkscreen boards only — VEXT polarity is inverted vs. the original V3
; (see board_pinout.h and power_utils.cpp vext_ctrl_ON()/OFF()).
; No onboard GPS: set GPS source to "Fixed" via web UI or serial CLI.
; WiFi STA + APRS-IS + TCP KISS available via iGate role.
; BLE KISS TNC available via NimBLE (APRS.fi UUID set).
; USB-serial KISS available at 115200 baud.
;
; Build:  pio run -e heltec_v3_433_aprs
; Upload: pio run -e heltec_v3_433_aprs -t upload
; FS:     pio run -e heltec_v3_433_aprs -t uploadfs

; Allow the PlatformIO VSCode extension to resolve ${common.*} when this file
; is parsed standalone (without the root platformio.ini as the entry point).
[platformio]
extra_configs = ../../common_settings.ini

[env:heltec_v3_433_aprs]
extends = env:esp32
board = heltec_wifi_lora_32_V3
board_build.mcu = esp32s3
board_build.partitions = partitions_8mb_ota.csv
; Unlike the bare esp32-s3-devkitc-1 boards (LoRanger_V1, wireless_tracker,
; tbeam_433_1w_aprs), the actual V3.2 hardware carries a Silicon Labs CP210x
; USB-UART bridge chip on UART0 (confirmed via `pio device list`: VID:PID
; 10C4:EA60, not Espressif's native-USB 303A:1001 the board.json declares).
; ${common.usb_flags} (ARDUINO_USB_CDC_ON_BOOT=1) was tried here once — it
; rebinds Serial to the SoC's native USB peripheral, which isn't wired to
; anything on this board, going completely silent (both directions) while
; the CP210x-routed UART0 keeps carrying only the low-level ROM/panic
; console. Do not add it back without re-confirming the hardware.
build_flags =
    ${common.build_flags}
    -D RADIOLIB_EXCLUDE_LR11X0=1
    -D RADIOLIB_EXCLUDE_SX127X=1
    -D RADIOLIB_EXCLUDE_SX128X=1
    -D HELTEC_V3_433_APRS
lib_deps =
    ${common.lib_deps}
    ${common.display_libs}
