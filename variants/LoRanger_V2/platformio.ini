; Allow the PlatformIO VSCode extension to resolve ${common.*} when this file
; is parsed standalone (without the root platformio.ini as the entry point).
[platformio]
extra_configs = ../../common_settings.ini

[env:LoRanger_V2]
extends = env:esp32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
; DIO, not the esp32-s3-devkitc-1 default of QIO: mirrors V1 (same flash chip
; family). Must match --flash_mode in .github/workflows/flasher.yml so the
; compiled bootloader header and the merge_bin-patched factory image agree.
; See variants/LoRanger_V1/platformio.ini for the full rationale.
board_build.flash_mode = dio
; Native ESP32-S3 USB-Serial/JTAG (ARDUINO_USB_MODE=1) gates TX flush on DTR
; high. PuTTY asserts DTR on connect; pio's miniterm doesn't unless told.
; Safe on this board — no USB-UART bridge IC means DTR/RTS aren't wired to
; the bootloader strap pins, so this won't cause spurious resets. (USB comes
; directly from the ESP32-S3's native USB-OTG pins, routed out through the
; carrier's USB-C — the carrier adds no bridge chip.)
monitor_dtr = 1
monitor_rts = 0
; Override env:esp32's `monitor_filters = esp32_exception_decoder` — that
; filter has known issues with native USB-Serial/JTAG streams and may be
; eating live output. Empty value disables all filters for this env.
monitor_filters =
; 8 MB flash, dual-slot OTA (matches V1). See the comment in the top-level
; platformio.ini for why huge_app.csv isn't usable here.
board_build.partitions = partitions_8mb_ota.csv
; HAS_DISPLAY intentionally inherited (from common.build_flags) rather than
; stripped like V1: V2 boards ship headless but can accept a 0.96" I2C OLED on
; J2. display.cpp detects the OLED at boot via an explicit I2C ACK probe
; (gated on LORANGER_V2) before calling the Adafruit library's begin() — the
; library's own probe-failure path hangs in a while(true), which is the bug
; V1 avoids by compiling HAS_DISPLAY out. One firmware image, user can retrofit
; a display without reflashing.
build_flags =
	${common.build_flags}
	${common.usb_flags}
	-D RADIOLIB_EXCLUDE_LR11X0=1
	-D RADIOLIB_EXCLUDE_SX127X=1
	-D RADIOLIB_EXCLUDE_SX128X=1
	-D LORANGER_V2
lib_deps =
	${common.lib_deps}
